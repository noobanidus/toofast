plugins {
    id 'net.neoforged.moddev'
}

// Vanilla depends on ASM 9.3, MDG makes that a 'strict' version constraint,
// but Mixin and MixinExtras needs newer ASM so we override that here.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.ow2.asm") {
            details.useVersion(project.asm_version)
            details.because("Mixin requires new ASM")
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "org.ow2.asm:asm:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-analysis:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-commons:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-tree:${project.asm_version}"
    compileOnly "org.ow2.asm:asm-util:${project.asm_version}"

    compileOnly "net.fabricmc:sponge-mixin:${project.mixin_version}"
}

neoForge {
    neoFormVersion = project.neoform_version

    def atFile = file("src/main/resources/META-INF/accesstransformer.cfg")
    if (atFile.exists()) {
        accessTransformers {
            from atFile
            publish atFile
        }
    }

    validateAccessTransformers.set(true)
}

def generatedResources = file("src/generated/resources")

sourceSets {
    main {
        resources.srcDir(generatedResources)
    }
}

tasks.named("processResources") {
    exclude(".cache/**")
}

tasks.build.mustRunAfter tasks.clean
tasks.publish.mustRunAfter tasks.build
tasks.buildAndRelease.dependsOn(tasks.clean, tasks.build, tasks.publish)

publishMods {
    apply from: "../gradle/property_helper.gradle"

    file = tasks.jar.archiveFile
    modLoaders.add("fabric")
    modLoaders.add("neoforge")

    var env = System.getenv()

    def utils = project.objects.newInstance(ExecUtils)

    def gitRepo = utils.getExecOutput(['git', 'remote', 'get-url', 'origin'])
    def gitCommit = utils.getExecOutput(['git', 'log', '-n', '1', '--pretty=tformat:%h'])
    def gitPrevCommit = project.findProperty("git_previous_commit") ?: env["GIT_PREVIOUS_COMMIT"]

    var changelogText = ""

    if (gitCommit && gitPrevCommit) {
        changelogText += utils.getExecOutput(['git', 'log', "--pretty=tformat:- %s [(%h)](${gitRepo}/commit/%h)", '' + gitPrevCommit + '..' + gitCommit])
    }

    // Limit the changelog to 500 characters
    changelogText = changelogText.take(500)

    def uploadDependencies = [
    ]

    if (project.hasProperty('curseforge_id')) {
        curseforge('curseforg') {

            projectSlug = "too-fast"
            type = STABLE
            displayName = "too-fast-${rootProject.minecraft_version}-${rootProject.mod_version}"
            accessToken = project.findProperty("curse_auth")
            projectId = project.findProperty('curseforge_id_fabric')
            announcementTitle = "Too Fast ${rootProject.minecraft_version}-${rootProject.mod_version} for NeoForge & Fabric on CurseForge"
            minecraftVersions.add(project.minecraft_version)
            changelog = changelogText

            uploadDependencies.each { dep, required ->
                if (required) {
                    requires(dep)
                } else {
                    optional(dep)
                }
            }
        }
    }

    if (project.hasProperty('modrinth_id')) {
        modrinth('modrinth') {
            type = STABLE
            displayName = "too-fast-${rootProject.minecraft_version}-${rootProject.mod_version}"
            accessToken = project.findProperty("modrinth_auth")
            projectId = project.findProperty('modrinth_id')
            announcementTitle = "Too Fast ${rootProject.minecraft_version}-${rootProject.mod_version} for NeoForge & Fabric on Modrinth"
            minecraftVersions.add(project.minecraft_version)
            changelog = changelogText

            dependencies {
                uploadDependencies.each { dep, required ->
                    if (required) {
                        requires(dep)
                    } else {
                        optional(dep)
                    }
                }
            }
        }
    }

    if (project.hasProperty("curse_discord_webhook")) {
        discord {
            webhookUrl = project.findProperty("curse_discord_webhook")
            username = "Too Fast Update"
            content = "A new version of Too Fast has been released!\n\n${changelogText.take(500)}"
        }
    }
}

